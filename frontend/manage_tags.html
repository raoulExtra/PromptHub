<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PromptHub — Edit Tags</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/frontend/static/index_style.css">
<style>
    html,body{overflow:auto}.tags-page{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:32px 52px;min-height:100vh}
    .tags-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:52px}.tags-heading{font-family:'Bebas Neue',sans-serif;font-size:clamp(42px,6vw,72px);letter-spacing:.03em;line-height:1}.tags-heading span{color:var(--primary)}
    .back-link{color:var(--text-dim);text-decoration:none;font-size:12px;border:1px solid var(--border);padding:9px 14px;border-radius:4px}.back-link:hover{color:var(--primary);border-color:var(--border-hover)}.bottom-back{display:inline-block;margin-top:22px}
    .tags-panel{background:var(--surface);border:1px solid var(--border);padding:22px;box-shadow:8px 8px rgba(232,255,71,.08)}
    .panel-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px}
    .controls{display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;margin-bottom:22px}.controls input{min-width:0;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:12px;font:12px 'DM Mono',monospace;outline:none}.controls input:focus{border-color:var(--primary)}
    .controls button{border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);padding:0 16px;font-size:11px;font-weight:700;cursor:pointer}.controls .danger{background:transparent;color:#ff7777;border-color:rgba(255,119,119,.45)}.controls button:hover{filter:brightness(1.1)}
    .tag-row{display:flex;align-items:center;gap:12px;padding:14px 8px;border-top:1px solid var(--border);font:13px 'DM Mono',monospace}.tag-row input{accent-color:var(--primary);width:16px;height:16px}.tag-row small{margin-left:auto;color:var(--text-dim);font-size:10px}.empty{color:var(--text-dim);padding:28px 8px;text-align:center;font-size:12px}
    @media(max-width:700px){.tags-page{padding:24px 18px}.tags-header{margin-bottom:34px}.controls{grid-template-columns:1fr 1fr}.controls button{padding:11px}.tag-row{flex-wrap:wrap}.tag-row small{width:100%;margin-left:28px}}
</style></head><body><main class="tags-page"><header class="tags-header"><div><div class="eyebrow"><div class="eyebrow-bar"></div><span class="eyebrow-text">PromptHub / Library</span></div><h1 class="tags-heading">Edit <span>Tags.</span></h1></div></header>
<section class="tags-panel"><div class="panel-label">Registered tags · <span id="tagTotal">0</span></div><div class="controls"><input id="filter" placeholder="Filter tags (* wildcard)"><input id="newTag" placeholder="Register new tag"><button id="add">Register</button><button id="remove" class="danger">Remove selected</button></div><div id="tags"></div></section><a class="back-link bottom-back" href="/">← Back to Home</a></main>
<script>
const filter=document.getElementById('filter'),newTag=document.getElementById('newTag'),list=document.getElementById('tags'),total=document.getElementById('tagTotal');let details=[];
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){let pattern=filter.value.trim().toLowerCase().replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*');let shown=details.filter(t=>!pattern||new RegExp('^'+pattern+'$').test(t.name.toLowerCase()));total.textContent=details.length;list.innerHTML=shown.length?shown.map(t=>`<div class="tag-row"><input type="checkbox" value="${esc(t.name)}"><span>${esc(t.name)}</span><small>Updated ${esc(t.updated_at||'')}</small></div>`).join(''):'<div class="empty">No matching tags</div>';}
async function load(){let r=await fetch('/api/tags/details');details=await r.json();render();}
document.getElementById('add').onclick=async()=>{if(!newTag.value.trim())return;let r=await fetch('/api/tags',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:newTag.value.trim()})});if(r.ok){newTag.value='';load();}else alert((await r.json()).detail||'Unable to register tag');};
document.getElementById('remove').onclick=async()=>{let selected=[...list.querySelectorAll('input:checked')].map(x=>x.value);if(!selected.length)return;let prompts=await (await fetch('/api/prompts')).json();for(const name of selected){let used=prompts.filter(p=>(p.tags||[]).some(t=>t.toLowerCase()===name.toLowerCase())).length;let detach=false;if(used){if(!confirm(`The tag “${name}” is assigned to ${used} prompt(s). Detach it from those prompts?\n\nOK = detach assignments\nCancel = keep assignments`))detach=false;else detach=true;}if(!confirm(`Delete the registered tag “${name}”?`))continue;await fetch('/api/tags/'+encodeURIComponent(name)+(detach?'?detach=true':''),{method:'DELETE'});}load();};filter.addEventListener('input',render);load();
</script></body></html>
